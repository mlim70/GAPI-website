name: Email Jobs (every 10 min)

on:
  schedule:
    - cron: "*/10 * * * *"   # runs every 10 minutes (UTC)
  workflow_dispatch: {}       # allow manual runs

jobs:
  run-email-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: email-jobs
      cancel-in-progress: true

    steps:
      - name: Trigger email worker endpoint
        env:
          URL: ${{ vars.EMAIL_PROCESS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          echo "POST $URL"
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$URL" || true)
            echo "HTTP $code"
            cat /tmp/resp.txt || true
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "✅ Worker triggered successfully"; exit 0
            fi
            if [ "$i" -lt 3 ]; then echo "🔁 Retry $i..."; sleep $((i*5)); fi
          done
          echo "❌ Failed to trigger worker after retries"; exit 1
